name: Validate skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
  installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.20.0', '24']
        include:
          - node: '24'
            npm: '12.2.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.npm
        run: npm install --global npm@${{ matrix.npm }}
      - run: npm test
      - run: node bin/cli.mjs doctor
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: python scripts/validate.py
      - run: python scripts/package_skill.py
