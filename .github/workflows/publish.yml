name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v0.2.1

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select the release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(tag ?? '')) {
            throw new Error('Select an existing version tag such as v0.2.1.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          JS
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release identity
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          if (manifest.name !== '@lrzdeveloper/percepta-ux' || manifest.private ||
              process.env.RELEASE_TAG !== `v${manifest.version}`) {
            throw new Error('Package identity and release tag must match.');
          }
          JS
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run check:repo
      - run: npm test
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: python scripts/validate.py
      - name: Check whether the version is already published
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(manifest.name)}/${manifest.version}`;
          const response = await fetch(url);
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`Could not check npm publication status: ${response.status}`);
          }
          const published = response.status === 200;
          if (published) {
            const metadata = await response.json();
            if (metadata.name !== manifest.name || metadata.version !== manifest.version) {
              throw new Error('Unexpected npm package identity.');
            }
            console.log(`npm ${manifest.version} is already published; preserving the immutable version.`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!published}\n`);
          JS
      - name: Check npm publishing is configured
        if: steps.registry.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Add the NPM_TOKEN repository secret before publishing.'
            exit 1
          fi
      - name: Publish with provenance
        if: steps.registry.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"
